<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./assets/img/1.Sharkie/1.IDLE/1.png" type="image/x-icon">
    <title>Sharkie</title>
    <script type="module" src="./js/game.js"></script>

    <div id="start-screen">

        <div id="logo">

        </div>

        <div class="bubbles">
            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span></span>

            </button>

            <button id="controls-btn">

            </button>

            <button id="music-btn">

            </button>

            <button id="credits-btn">

            </button>

        </div>

    <div id="popup" class="hidden">

        <div class="popup-content">

            <div id="popup-text"></div>

            <button id="close-popup">
                Schließen

        </div>

    </div>

    <!-- ========================= -->
